name: CI/CD orders

# push a main: tests -> imagen en GHCR -> despliegue en la EC2 apps (si la variable EC2_HOST existe).
# EC2_HOST es la misma EIP de apps en los repos catalog, orders y notify (output AppsPublicIp).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_DIR: /opt/pedidos360/orders

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y correr tests
        run: ./mvnw -B clean verify

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: image
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar docker-compose.yml a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.APP_DIR }}
      - name: Levantar contenedores
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            if [ ! -f .env ]; then
              echo "ERROR: no existe ${{ env.APP_DIR }}/.env en esta EC2 ($(hostname))."
              echo "Revisa que la variable EC2_HOST de este repo tenga la IP correcta (Outputs del stack de CloudFormation)."
              exit 1
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              if curl -fs http://localhost:8082/actuator/health; then echo; docker compose ps; exit 0; fi
              sleep 5
            done
            docker compose logs --tail 80
            exit 1
