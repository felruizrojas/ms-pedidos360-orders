# Solo para desarrollo local: un nodo RabbitMQ con la UI de administración.
# En AWS RabbitMQ es un clúster de 2 nodos en su propia EC2 (infra/mq/). Misma versión (3.13) y mismas policies.
# Igual que en AWS, orders se conecta por RABBIT_ADDRESSES:
#   - orders con ./mvnw spring-boot:run      -> RABBIT_ADDRESSES=localhost:5672 (default)
#   - orders en Docker (docker compose up)   -> RABBIT_ADDRESSES=host.docker.internal:5672
# Levantar:  docker compose -f docker-compose.rabbitmq.yml up -d
# UI:        http://localhost:15672  (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Dead-lettering y espejado por policies, igual que infra/mq/definitions.json (orders declara las colas
    # sin argumentos). Con un solo nodo el espejado no hace nada, pero deja las policies iguales a las del
    # clúster. set_policy es idempotente: se aplica en cada arranque.
    # Corre como rabbitmq (no root) para no dejar una .erlang.cookie que el servidor no pueda leer, y
    # reintenta porque justo después de arrancar el contenedor la VM de Erlang aún no responde.
    post_start:
      - user: rabbitmq
        command:
          - sh
          - -c
          - |
            until rabbitmqctl -q await_startup >/dev/null 2>&1; do sleep 2; done
            rabbitmqctl -q set_policy --apply-to queues --priority 0 policy.email.dlx '^q\.cmd\.email$' '{"dead-letter-exchange":"cmd.dead.dlx","dead-letter-routing-key":"email.send","ha-mode":"all","ha-sync-mode":"automatic","ha-promote-on-shutdown":"always","ha-promote-on-failure":"always"}'
            rabbitmqctl -q set_policy --apply-to queues --priority 0 policy.kitchen.dlx '^q\.cmd\.kitchen$' '{"dead-letter-exchange":"cmd.dead.dlx","dead-letter-routing-key":"kitchen.ticket","ha-mode":"all","ha-sync-mode":"automatic","ha-promote-on-shutdown":"always","ha-promote-on-failure":"always"}'
            rabbitmqctl -q set_policy --apply-to queues --priority 0 policy.invoice.dlx '^q\.cmd\.invoice$' '{"dead-letter-exchange":"cmd.dead.dlx","dead-letter-routing-key":"invoice.gen","ha-mode":"all","ha-sync-mode":"automatic","ha-promote-on-shutdown":"always","ha-promote-on-failure":"always"}'
            rabbitmqctl -q set_policy --apply-to queues --priority 0 policy.dlq.ha '^q\.cmd\.(email|kitchen|invoice)\.dlq$' '{"ha-mode":"all","ha-sync-mode":"automatic","ha-promote-on-shutdown":"always","ha-promote-on-failure":"always"}'

volumes:
  rabbitdata:
